# Blueprint do Render Free para a API NestJS do StockFlow (Fase 8).
#
# O banco PostgreSQL 17 roda no Neon Free (externo ao Render para não expirar
# em 30 dias), e o frontend SPA + proxy `/api/*` roda no Cloudflare Pages.
# Nenhum valor secreto é versionado aqui (`sync: false`).

services:
  - type: web
    name: stockflow-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # `--include=dev` é obrigatório durante o build porque `@nestjs/cli`,
    # `typescript`, `prisma`, `dotenv` e `@swc/core` estão em `devDependencies`
    # e o Render define `NODE_ENV=production` no ambiente.
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    # No plano Free do Render não há `preDeployCommand`, então `start:deploy`
    # aplica as migrations pendentes (`prisma migrate deploy`) antes de subir
    # `node dist/main.js`.
    startCommand: npm run start:deploy
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: LOG_LEVEL
        value: info
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: ALLOW_DEMO_SEED
        value: 'false'
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_OPERATOR_PASSWORD
        sync: false
