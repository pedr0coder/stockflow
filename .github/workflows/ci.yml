name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch: um push novo torna a execução
# anterior irrelevante, e deixá-la rodando só ocupa fila.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão única em todo o pipeline. O mesmo número está em .nvmrc e no
  # `engines` dos dois package.json.
  NODE_VERSION: '24.15.0'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Verifica que o .env nunca foi commitado. Roda primeiro e é barato: se um
  # segredo entrou no repositório, nada mais importa até isso ser resolvido.
  # ─────────────────────────────────────────────────────────────────────────
  secrets-check:
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nenhum arquivo .env versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env está versionado. Remova-o do índice e troque os segredos."
            exit 1
          fi
          # `.env.example` é o único permitido, e sem valor preenchido.
          tracked=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::arquivos de ambiente versionados: $tracked"
            exit 1
          fi
          echo "ok: apenas .env.example está versionado"

      - name: .env.example não traz valor de segredo
        run: |
          # Toda chave que contenha SECRET, PASSWORD ou TOKEN precisa estar vazia.
          if grep -nE '^[A-Z_]*(SECRET|PASSWORD|TOKEN)[A-Z_]*=.+' .env.example; then
            echo "::error::.env.example tem valor preenchido em uma chave sensível"
            exit 1
          fi
          echo "ok: .env.example não contém valor de segredo"

  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: secrets-check

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        # Sem healthcheck, os passos começariam antes de o banco aceitar
        # conexão e a suíte falharia de forma intermitente.
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://stockflow:ci_only_not_a_real_secret@localhost:5432/stockflow_test?schema=public
      DATABASE_URL_TEST: postgresql://stockflow:ci_only_not_a_real_secret@localhost:5432/stockflow_test?schema=public
      # Valores descartáveis, válidos só para o CI. Precisam ter 32+ caracteres
      # e ser diferentes entre si, porque é isso que a aplicação exige no boot.
      JWT_SECRET: ci_access_secret_com_mais_de_32_caracteres_000
      JWT_REFRESH_SECRET: ci_refresh_secret_com_mais_de_32_caracteres_111
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: error

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` e não `npm install`: instala exatamente o lock e falha se ele
      # divergir do package.json. É o que impede o CI de resolver uma versão
      # diferente da que roda na máquina do desenvolvedor — inclusive a
      # armadilha do `prisma@latest` apontar para release candidate (§3.1).
      - name: Instalar dependências
        run: npm ci

      # O cliente do Prisma não é versionado (é artefato de build, específico de
      # plataforma). Precisa ser gerado antes de qualquer typecheck.
      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Conferir versões críticas
        run: |
          node -e "
            const lock = require('./package-lock.json');
            const want = { prisma: '7.10.1', '@prisma/client': '7.10.1', typescript: '6.0.3' };
            let failed = false;
            for (const [pkg, version] of Object.entries(want)) {
              const got = lock.packages['node_modules/' + pkg]?.version;
              const ok = got === version;
              console.log((ok ? 'ok  ' : 'FALHA ') + pkg + ': ' + got + ' (esperado ' + version + ')');
              if (!ok) failed = true;
            }
            if (failed) process.exit(1);
          "

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Aplicar migrations no banco de teste
        run: npm run prisma:deploy

      # Prova que a migration aplica em banco vazio e que as invariantes de
      # banco (CHECK e índice trigram) existem. A suíte de integração confere
      # isso por consulta ao catálogo do Postgres.
      - name: Testes de integração
        run: npm run test:int

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: secrets-check

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # E2E (Marco 7A, docs/19-plano-fase-7.md §19.5). Depende de `backend` e
  # `frontend` já terem passado: é o job mais caro do pipeline, e não faz
  # sentido gastar ~1min subindo browser e dois servidores reais se o lint ou
  # o typecheck já reprovaram.
  #
  # O banco deste serviço é efêmero e existe só durante o job — mas o nome
  # "stockflow_e2e" é mantido de propósito igual ao do ambiente local: é
  # exatamente essa string que `selectE2eDatabaseUrl`
  # (frontend/e2e/global-setup.ts) exige conter "e2e", a mesma trava que
  # protege o ambiente local contra apontar, por engano, para outro banco.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: stockflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Consumidas por `global-setup.ts` (que monta o `DATABASE_URL` dos
      # processos filhos) e por `playwright.config.ts` (que sobe backend e
      # frontend reais). `DATABASE_URL`/`DATABASE_URL_TEST` ficam de fora de
      # propósito: sem elas definidas, a trava de igualdade de
      # `selectE2eDatabaseUrl` não tem contra o que comparar, e isso é
      # seguro — o único banco que existe neste job É o E2E.
      DATABASE_URL_E2E: postgresql://stockflow:ci_only_not_a_real_secret@localhost:5432/stockflow_e2e?schema=public
      JWT_SECRET: ci_access_secret_com_mais_de_32_caracteres_000
      JWT_REFRESH_SECRET: ci_refresh_secret_com_mais_de_32_caracteres_111
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      LOG_LEVEL: warn
      # Senhas dos usuários fictícios do seed (prisma/seed.ts) — mesma
      # política de 10+ caracteres de docs/08-seguranca.md §8.1, só não é
      # segredo real: existe apenas durante este job, num banco efêmero.
      SEED_ADMIN_PASSWORD: ci-apenas-admin-000
      SEED_MANAGER_PASSWORD: ci-apenas-gerente-000
      SEED_OPERATOR_PASSWORD: ci-apenas-operador-000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # As duas instalações são necessárias: `global-setup.ts` roda o CLI do
      # Prisma e o seed de dentro de `backend/`; `playwright.config.ts` sobe
      # o servidor Nest e o Vite de dentro de cada pasta.
      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      # Só Chromium, igual ao ambiente local — nenhum motivo para pagar o
      # tempo de baixar Firefox/WebKit numa suíte que não os usa.
      # `--with-deps` instala também as bibliotecas de sistema do runner.
      - name: Instalar navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        working-directory: frontend
        run: npm run test:e2e

      # Só em falha: trace, screenshot e o relatório HTML (que embute os
      # dois) — nada disso aparece no log do job, só fica disponível para
      # quem baixar o artefato, e só quem tem acesso ao repositório consegue
      # baixá-lo. Nenhum destes arquivos contém token, cookie ou senha em
      # texto puro: o Playwright grava cabeçalho de autorização redigido por
      # padrão, e nenhum script deste projeto imprime segredo no log.
      - name: Publicar evidência de falha (trace, screenshots, relatório)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Formatação é verificada uma vez, na raiz, porque o Prettier é um só para o
  # repositório inteiro.
  # ─────────────────────────────────────────────────────────────────────────
  format:
    name: Formatação
    runs-on: ubuntu-latest
    needs: secrets-check

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar ferramentas da raiz
        run: npm ci

      - name: Prettier
        run: npm run format:check
